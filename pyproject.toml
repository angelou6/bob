[project]
name = "bob"
version = "0.1.0"
description = "Discord bot that plays music"
readme = "README.md"
authors = [
    { name = "jaroflemonade", email = "jaroflemonade@noreply.codeberg.org" }
]
requires-python = ">=3.13"
dependencies = [
    "lxml[cssselect]>=6.1.3",
    "py-cord[voice]>=2.8.1",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
bob = "bob.bob:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
]
